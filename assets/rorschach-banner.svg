<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210">
  <defs>
    <style>
      @keyframes shakeX {
        0%, 100% { transform: translateX(0); }
        10%  { transform: translateX(-1.5px); }
        20%  { transform: translateX(1.2px); }
        30%  { transform: translateX(-1.8px); }
        40%  { transform: translateX(2px); }
        50%  { transform: translateX(-1px); }
        60%  { transform: translateX(1.5px); }
        70%  { transform: translateX(-2px); }
        80%  { transform: translateX(0.8px); }
        90%  { transform: translateX(-0.5px); }
      }
      @keyframes glitchCyan {
        0%, 90%, 100% { opacity: 0; transform: translateX(0); }
        91%  { opacity: 0.18; transform: translateX(-4px); }
        93%  { opacity: 0; transform: translateX(0); }
        94%  { opacity: 0.18; transform: translateX(3px); }
        96%  { opacity: 0; transform: translateX(0); }
      }
      @keyframes glitchPink {
        0%, 92%, 100% { opacity: 0; transform: translateX(0); }
        93%  { opacity: 0.18; transform: translateX(3px); }
        95%  { opacity: 0; transform: translateX(0); }
        97%  { opacity: 0.18; transform: translateX(-3px); }
        99%  { opacity: 0; transform: translateX(0); }
      }
      @keyframes scanlineMove {
        0%   { transform: translateY(-10px); opacity: 0; }
        10%  { opacity: 0.04; }
        90%  { opacity: 0.04; }
        100% { transform: translateY(220px); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.45; }
      }
      .main    { animation: shakeX 0.25s ease-in-out infinite; }
      .cyan    { animation: glitchCyan 5s ease-in-out infinite; }
      .pink    { animation: glitchPink 5s ease-in-out infinite; }
      .scan    { animation: scanlineMove 7s linear infinite; }
      .glow    { animation: pulseGlow 3s ease-in-out infinite; }
      .mono    { font-family: 'Courier New', 'Menlo', 'Monaco', 'Consolas', monospace;
                 font-size: 11px; }
    </style>
  </defs>

  <!-- Deep dark background -->
  <rect width="900" height="210" fill="#0A0A0A" rx="6"/>

  <!-- Glitch shadow: cyan -->
  <text x="450" y="30" text-anchor="middle" class="mono cyan" fill="#67E8F9" opacity="0">
    <tspan x="450" dy="0">╔══════════════════════════════════════════════════════════╗</tspan>
    <tspan x="450" dy="21">║   ██████╗  ██████╗ ██████╗ ███████╗ ██████╗██╗  ██╗   ║</tspan>
    <tspan x="450" dy="21">║   ██╔══██╗██╔═══██╗██╔══██╗██╔════╝██╔════╝██║  ██║   ║</tspan>
    <tspan x="450" dy="21">║   ██████╔╝██║   ██║██████╔╝███████╗██║     ███████║   ║</tspan>
    <tspan x="450" dy="21">║   ██╔══██╗██║   ██║██╔══██╗╚════██║██║     ██╔══██║   ║</tspan>
    <tspan x="450" dy="21">║   ██║  ██║╚██████╔╝██║  ██║███████║╚██████╗██║  ██║   ║</tspan>
    <tspan x="450" dy="21">║   ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚══════╝ ╚═════╝╚═╝  ╚═╝   ║</tspan>
    <tspan x="450" dy="21">╚══════════════════════════════════════════════════════════╝</tspan>
  </text>

  <!-- Glitch shadow: pink -->
  <text x="450" y="30" text-anchor="middle" class="mono pink" fill="#F472B6" opacity="0">
    <tspan x="450" dy="0">╔══════════════════════════════════════════════════════════╗</tspan>
    <tspan x="450" dy="21">║   ██████╗  ██████╗ ██████╗ ███████╗ ██████╗██╗  ██╗   ║</tspan>
    <tspan x="450" dy="21">║   ██╔══██╗██╔═══██╗██╔══██╗██╔════╝██╔════╝██║  ██║   ║</tspan>
    <tspan x="450" dy="21">║   ██████╔╝██║   ██║██████╔╝███████╗██║     ███████║   ║</tspan>
    <tspan x="450" dy="21">║   ██╔══██╗██║   ██║██╔══██╗╚════██║██║     ██╔══██║   ║</tspan>
    <tspan x="450" dy="21">║   ██║  ██║╚██████╔╝██║  ██║███████║╚██████╗██║  ██║   ║</tspan>
    <tspan x="450" dy="21">║   ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚══════╝ ╚═════╝╚═╝  ╚═╝   ║</tspan>
    <tspan x="450" dy="21">╚══════════════════════════════════════════════════════════╝</tspan>
  </text>

  <!-- Main text: Hermes violet, horizontal shake only -->
  <text x="450" y="30" text-anchor="middle" class="mono main" fill="#A78BFA">
    <tspan x="450" dy="0">╔══════════════════════════════════════════════════════════╗</tspan>
    <tspan x="450" dy="21">║   ██████╗  ██████╗ ██████╗ ███████╗ ██████╗██╗  ██╗   ║</tspan>
    <tspan x="450" dy="21">║   ██╔══██╗██╔═══██╗██╔══██╗██╔════╝██╔════╝██║  ██║   ║</tspan>
    <tspan x="450" dy="21">║   ██████╔╝██║   ██║██████╔╝███████╗██║     ███████║   ║</tspan>
    <tspan x="450" dy="21">║   ██╔══██╗██║   ██║██╔══██╗╚════██║██║     ██╔══██║   ║</tspan>
    <tspan x="450" dy="21">║   ██║  ██║╚██████╔╝██║  ██║███████║╚██████╗██║  ██║   ║</tspan>
    <tspan x="450" dy="21">║   ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚══════╝ ╚═════╝╚═╝  ╚═╝   ║</tspan>
    <tspan x="450" dy="21">╚══════════════════════════════════════════════════════════╝</tspan>
  </text>

  <!-- Scanline overlay -->
  <rect x="0" y="0" width="900" height="2.5" class="scan" fill="#A78BFA" opacity="0"/>

  <!-- Pulsing border glow -->
  <rect x="0" y="0" width="900" height="210" fill="none" rx="6" stroke="#8B5CF6" stroke-width="1.5" class="glow"/>
</svg>
