<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220">
  <defs>
    <style>
      @keyframes shakeX {
        0%, 100% { transform: translateX(0); }
        10%  { transform: translateX(-1.2px); }
        20%  { transform: translateX(1.0px); }
        30%  { transform: translateX(-1.5px); }
        40%  { transform: translateX(1.5px); }
        50%  { transform: translateX(-0.8px); }
        60%  { transform: translateX(1.2px); }
        70%  { transform: translateX(-1.8px); }
        80%  { transform: translateX(0.6px); }
        90%  { transform: translateX(-0.4px); }
      }
      @keyframes glitchCyan {
        0%, 90%, 100% { opacity: 0; transform: translateX(0); }
        91%  { opacity: 0.18; transform: translateX(-3px); }
        93%  { opacity: 0; transform: translateX(0); }
        95%  { opacity: 0.18; transform: translateX(3px); }
        97%  { opacity: 0; transform: translateX(0); }
      }
      @keyframes glitchRed {
        0%, 92%, 100% { opacity: 0; transform: translateX(0); }
        93%  { opacity: 0.18; transform: translateX(3px); }
        95%  { opacity: 0; transform: translateX(0); }
        96%  { opacity: 0.18; transform: translateX(-3px); }
        98%  { opacity: 0; transform: translateX(0); }
      }
      @keyframes scanlineMove {
        0%   { transform: translateY(-10px); opacity: 0; }
        10%  { opacity: 0.06; }
        90%  { opacity: 0.06; }
        100% { transform: translateY(230px); opacity: 0; }
      }
      .shake   { animation: shakeX 0.25s ease-in-out infinite; }
      .cyan    { animation: glitchCyan 5s ease-in-out infinite; }
      .red     { animation: glitchRed 5s ease-in-out infinite; }
      .scan    { animation: scanlineMove 6s linear infinite; }
      .char    { font-family: 'Courier New', 'Menlo', 'Monaco', 'Consolas', monospace;
                 font-size: 12px; }
    </style>
  </defs>

  <!-- Dark background -->
  <rect width="960" height="220" fill="#0A0A0A" rx="8"/>

  <!-- Glitch: cyan -->
  <text x="480" y="32" text-anchor="middle" class="char cyan" fill="#67E8F9" opacity="0">
    <tspan x="480" dy="0">╔══════════════════════════════════════════════════════════╗</tspan>
    <tspan x="480" dy="21">║   ██████╗  ██████╗ ██████╗ ███████╗ ██████╗██╗  ██╗   ║</tspan>
    <tspan x="480" dy="21">║   ██╔══██╗██╔═══██╗██╔══██╗██╔════╝██╔════╝██║  ██║   ║</tspan>
    <tspan x="480" dy="21">║   ██████╔╝██║   ██║██████╔╝███████╗██║     ███████║   ║</tspan>
    <tspan x="480" dy="21">║   ██╔══██╗██║   ██║██╔══██╗╚════██║██║     ██╔══██║   ║</tspan>
    <tspan x="480" dy="21">║   ██║  ██║╚██████╔╝██║  ██║███████║╚██████╗██║  ██║   ║</tspan>
    <tspan x="480" dy="21">║   ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚══════╝ ╚═════╝╚═╝  ╚═╝   ║</tspan>
    <tspan x="480" dy="21">╚══════════════════════════════════════════════════════════╝</tspan>
  </text>

  <!-- Glitch: red -->
  <text x="480" y="32" text-anchor="middle" class="char red" fill="#EF4444" opacity="0">
    <tspan x="480" dy="0">╔══════════════════════════════════════════════════════════╗</tspan>
    <tspan x="480" dy="21">║   ██████╗  ██████╗ ██████╗ ███████╗ ██████╗██╗  ██╗   ║</tspan>
    <tspan x="480" dy="21">║   ██╔══██╗██╔═══██╗██╔══██╗██╔════╝██╔════╝██║  ██║   ║</tspan>
    <tspan x="480" dy="21">║   ██████╔╝██║   ██║██████╔╝███████╗██║     ███████║   ║</tspan>
    <tspan x="480" dy="21">║   ██╔══██╗██║   ██║██╔══██╗╚════██║██║     ██╔══██║   ║</tspan>
    <tspan x="480" dy="21">║   ██║  ██║╚██████╔╝██║  ██║███████║╚██████╗██║  ██║   ║</tspan>
    <tspan x="480" dy="21">║   ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚══════╝ ╚═════╝╚═╝  ╚═╝   ║</tspan>
    <tspan x="480" dy="21">╚══════════════════════════════════════════════════════════╝</tspan>
  </text>

  <!-- Main text: gold, horizontal shake -->
  <text x="480" y="32" text-anchor="middle" class="char shake" fill="#FBBF24">
    <tspan x="480" dy="0">╔══════════════════════════════════════════════════════════╗</tspan>
    <tspan x="480" dy="21">║   ██████╗  ██████╗ ██████╗ ███████╗ ██████╗██╗  ██╗   ║</tspan>
    <tspan x="480" dy="21">║   ██╔══██╗██╔═══██╗██╔══██╗██╔════╝██╔════╝██║  ██║   ║</tspan>
    <tspan x="480" dy="21">║   ██████╔╝██║   ██║██████╔╝███████╗██║     ███████║   ║</tspan>
    <tspan x="480" dy="21">║   ██╔══██╗██║   ██║██╔══██╗╚════██║██║     ██╔══██║   ║</tspan>
    <tspan x="480" dy="21">║   ██║  ██║╚██████╔╝██║  ██║███████║╚██████╗██║  ██║   ║</tspan>
    <tspan x="480" dy="21">║   ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚══════╝ ╚═════╝╚═╝  ╚═╝   ║</tspan>
    <tspan x="480" dy="21">╚══════════════════════════════════════════════════════════╝</tspan>
  </text>

  <!-- Scanline -->
  <rect x="0" y="0" width="960" height="3" class="scan" fill="#FBBF24" opacity="0"/>

  <!-- Border glow -->
  <rect x="0" y="0" width="960" height="220" fill="none" rx="8" stroke="#F59E0B" stroke-width="1.5" opacity="0.35"/>
</svg>
