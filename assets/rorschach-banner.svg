<svg xmlns="http://www.w3.org/2000/svg" width="700" height="210" viewBox="0 0 700 210">
  <defs>
    <style>
      @keyframes shake {
        0%, 100% { transform: translate(0, 0); }
        5%   { transform: translate(-1.5px, -0.5px); }
        10%  { transform: translate(1px, 0.5px); }
        15%  { transform: translate(-1px, -1px); }
        20%  { transform: translate(1.5px, 0px); }
        25%  { transform: translate(0px, 1px); }
        30%  { transform: translate(-0.5px, -1.5px); }
        35%  { transform: translate(1px, 1px); }
        40%  { transform: translate(0, 0); }
      }
      @keyframes glitchCyan {
        0%, 90%, 100% { opacity: 0; transform: translate(0, 0); }
        91%  { opacity: 0.15; transform: translate(-3px, 0); }
        93%  { opacity: 0; transform: translate(0, 0); }
        95%  { opacity: 0.15; transform: translate(3px, 0); }
        97%  { opacity: 0; transform: translate(0, 0); }
      }
      @keyframes glitchMagenta {
        0%, 92%, 100% { opacity: 0; transform: translate(0, 0); }
        93%  { opacity: 0.15; transform: translate(2px, 1px); }
        95%  { opacity: 0; transform: translate(0, 0); }
        96%  { opacity: 0.15; transform: translate(-2px, -1px); }
        98%  { opacity: 0; transform: translate(0, 0); }
      }
      @keyframes scanlineMove {
        0%   { transform: translateY(-10px); opacity: 0; }
        10%  { opacity: 0.06; }
        90%  { opacity: 0.06; }
        100% { transform: translateY(220px); opacity: 0; }
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.97; }
      }
      .main   { animation: shake 0.3s ease-in-out infinite; }
      .cyan   { animation: glitchCyan 4s ease-in-out infinite; }
      .magenta{ animation: glitchMagenta 4s ease-in-out infinite; }
      .scan   { animation: scanlineMove 6s linear infinite; }
      .flicker{ animation: flicker 0.12s ease-in-out infinite; }
      .char   { font-family: 'Courier New', 'Menlo', 'Monaco', 'Consolas', monospace;
                 font-size: 14px; }
    </style>
  </defs>

  <!-- Black background -->
  <rect width="700" height="210" fill="#000000" rx="8"/>

  <!-- Glitch shadow layers (occasional offset) -->
  <text x="350" y="28" text-anchor="middle" class="char cyan" fill="#00FFFF">
    <tspan x="350" dy="0">╔══════════════════════════════════════════════════════════╗</tspan>
    <tspan x="350" dy="20">║   ██████╗  ██████╗ ██████╗ ███████╗ ██████╗██╗  ██╗   ║</tspan>
    <tspan x="350" dy="20">║   ██╔══██╗██╔═══██╗██╔══██╗██╔════╝██╔════╝██║  ██║   ║</tspan>
    <tspan x="350" dy="20">║   ██████╔╝██║   ██║██████╔╝███████╗██║     ███████║   ║</tspan>
    <tspan x="350" dy="20">║   ██╔══██╗██║   ██║██╔══██╗╚════██║██║     ██╔══██║   ║</tspan>
    <tspan x="350" dy="20">║   ██║  ██║╚██████╔╝██║  ██║███████║╚██████╗██║  ██║   ║</tspan>
    <tspan x="350" dy="20">║   ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚══════╝ ╚═════╝╚═╝  ╚═╝   ║</tspan>
    <tspan x="350" dy="20">╚══════════════════════════════════════════════════════════╝</tspan>
  </text>

  <text x="350" y="28" text-anchor="middle" class="char magenta" fill="#FF00FF">
    <tspan x="350" dy="0">╔══════════════════════════════════════════════════════════╗</tspan>
    <tspan x="350" dy="20">║   ██████╗  ██████╗ ██████╗ ███████╗ ██████╗██╗  ██╗   ║</tspan>
    <tspan x="350" dy="20">║   ██╔══██╗██╔═══██╗██╔══██╗██╔════╝██╔════╝██║  ██║   ║</tspan>
    <tspan x="350" dy="20">║   ██████╔╝██║   ██║██████╔╝███████╗██║     ███████║   ║</tspan>
    <tspan x="350" dy="20">║   ██╔══██╗██║   ██║██╔══██╗╚════██║██║     ██╔══██║   ║</tspan>
    <tspan x="350" dy="20">║   ██║  ██║╚██████╔╝██║  ██║███████║╚██████╗██║  ██║   ║</tspan>
    <tspan x="350" dy="20">║   ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚══════╝ ╚═════╝╚═╝  ╚═╝   ║</tspan>
    <tspan x="350" dy="20">╚══════════════════════════════════════════════════════════╝</tspan>
  </text>

  <!-- Main text layer with shake -->
  <text x="350" y="28" text-anchor="middle" class="char main flicker" fill="#00FF41">
    <tspan x="350" dy="0">╔══════════════════════════════════════════════════════════╗</tspan>
    <tspan x="350" dy="20">║   ██████╗  ██████╗ ██████╗ ███████╗ ██████╗██╗  ██╗   ║</tspan>
    <tspan x="350" dy="20">║   ██╔══██╗██╔═══██╗██╔══██╗██╔════╝██╔════╝██║  ██║   ║</tspan>
    <tspan x="350" dy="20">║   ██████╔╝██║   ██║██████╔╝███████╗██║     ███████║   ║</tspan>
    <tspan x="350" dy="20">║   ██╔══██╗██║   ██║██╔══██╗╚════██║██║     ██╔══██║   ║</tspan>
    <tspan x="350" dy="20">║   ██║  ██║╚██████╔╝██║  ██║███████║╚██████╗██║  ██║   ║</tspan>
    <tspan x="350" dy="20">║   ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚══════╝ ╚═════╝╚═╝  ╚═╝   ║</tspan>
    <tspan x="350" dy="20">╚══════════════════════════════════════════════════════════╝</tspan>
  </text>

  <!-- Moving scanline overlay -->
  <rect x="0" y="0" width="700" height="3" class="scan" fill="#00FF41" opacity="0"/>

  <!-- Subtle border glow -->
  <rect x="0" y="0" width="700" height="210" fill="none" rx="8" stroke="#00FF41" stroke-width="1" opacity="0.3"/>
</svg>
